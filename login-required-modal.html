<!-- Login Required Modal -->
<div id="loginRequiredModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <span>Sign In Required</span>
            <button class="modal-close" onclick="document.getElementById('loginRequiredModal').classList.add('hidden')">✖️</button>
        </div>
        <div class="modal-body" style="text-align:center;">
            <p style="font-size:1.1rem;">You must sign in with Google to use online features like Create Room, Join Room, or Quick Match.</p>
            <button id="modalGoogleSignInBtn" style="margin-top:16px;font-size:1.05rem;padding:8px 20px;border-radius:8px;background:#fff;color:#333;box-shadow:0 2px 8px #0001;display:inline-flex;align-items:center;gap:10px;cursor:pointer;border:1px solid #ccc;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:22px;height:22px;vertical-align:middle;"> Sign in with Google
            </button>
        </div>
    </div>
</div>
